
<!DOCTYPE html>
<html>
<head>
    <title>My Workout Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Workout Tracker</h1>

    <h2>Today's Workout</h2>

    <h3>Workout Progress</h3>

    <p id="count">0 / 4</p>

    <p id="progress">0% completed</p>

    <h3>My Exercises</h3>

    <ul>
        <li>
            <input type="checkbox" class="exercise">
            Bench Press
        </li>

        <li>
            <input type="checkbox" class="exercise">
            Squats
        </li>

        <li>
            <input type="checkbox" class="exercise">
            Shoulder Press
        </li>

        <li>
            <input type="checkbox" class="exercise">
            Lat Pulldown
        </li>
    </ul>

    <script src="script.js"></script>

</body>
</html>
